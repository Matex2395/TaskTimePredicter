name: .NET 8 CI with SonarCloud

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    env:
      DEPLOY_PATH: C:\Deploy\TaskTimePredicter # Ruta simulada para deploy local

    steps:
    # 1️⃣ Descargar el código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Configurar .NET 8 SDK
    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    # 3️⃣ Restaurar dependencias
    - name: Restore dependencies
      run: dotnet restore

    # 4️⃣ Construir el proyecto
    - name: Build
      run: dotnet build --configuration Release --no-restore

    # 5️⃣ Ejecutar tests unitarios
    - name: Run tests
      run: dotnet test --logger "trx" --results-directory "TestResults"

    # 6️⃣ Publicar resultados de tests como artifacts descargables
    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults

    # 7️⃣ SonarCloud analysis (Windows compatible)
    - name: SonarCloud Scan
      run: |
        dotnet tool install --global dotnet-sonarscanner
        dotnet sonarscanner begin /k:"Matex2395_TaskTimePredicter" /o:"matex2395" /d:sonar.login="${{ secrets.JENKINS_SONARCLOUD_TOKEN }}"
        dotnet build ./TaskTimePredicter.sln
        dotnet sonarscanner end /d:sonar.login="${{ secrets.JENKINS_SONARCLOUD_TOKEN }}"

    # 8️⃣ Deploy simulado a máquina local
    - name: Simulated Deploy
      run: |
        mkdir $env:DEPLOY_PATH -Force
        Copy-Item -Path .\TaskTimePredicter\bin\Release\net8.0\* -Destination $env:DEPLOY_PATH -Recurse -Force
        Write-Host "Deploy completado en $env:DEPLOY_PATH"

    # 9️⃣ Notificación de estado a GitHub
    - name: Post CI status
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const status = '${{ job.status }}';
          const conclusion = status === 'success' ? 'success' : 'failure';
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'CI Status',
            head_sha: context.sha,
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: Build ${status.toUpperCase()},
              summary: Build #${process.env.GITHUB_RUN_NUMBER} finalizó con estado: ${status}
            }
          })
