name: .NET 8 CI with SonarCloud

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:      
      checks: write
      contents: read

    env:
      DEPLOY_PATH: C:\Deploy\TaskTimePredicter
      DOTNET_ROOT: C:\Program Files\dotnet

    steps:
    # 1️⃣ Descargar el código del repositorio
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2️⃣ Configurar .NET 8 SDK
    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    # 3️⃣ Restaurar dependencias
    - name: Restore dependencies
      run: dotnet restore

    # 4️⃣ Construir el proyecto
    - name: Build
      run: dotnet build --configuration Release --no-restore

    # 5️⃣ Ejecutar tests unitarios
    - name: Run tests
      run: dotnet test --logger "trx" --results-directory "TestResults"

    # 6️⃣ Publicar resultados de tests como artifacts descargables
    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults

    # 8️⃣ Deploy simulado (SOLO EN CASO DE ÉXITO)
    - name: Simulated Deploy
      if: success() 
      run: |
        mkdir $env:DEPLOY_PATH -Force
        Copy-Item -Path .\bin\Release\net8.0\* -Destination $env:DEPLOY_PATH -Recurse -Force
        Write-Host "Deploy completado en $env:DEPLOY_PATH"

    # 9️⃣ Notificación de fallo 
    - name: Notify on failure
      if: failure()
      run: |
        Write-Host "El workflow ha fallado. Revisa los logs de los pasos anteriores para más detalles."
        
    # 1️⃣0️⃣ Notificación de estado a GitHub (SIEMPRE)
    - name: Post CI status
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const status = '${{ job.status }}';
          const conclusion = status === 'success' ? 'success' : 'failure';
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'CI Status',
            head_sha: context.sha,
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: `CI Build Status: ${status.toUpperCase()}`,
              summary: `El workflow #${context.runNumber} finalizó con estado: **${status}**.`
            }
          })
